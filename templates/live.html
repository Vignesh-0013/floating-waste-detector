<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Waste Detection</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:Arial, sans-serif;

            background:linear-gradient(135deg,#141e30,#243b55);

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:20px;
        }

        .container{

            width:100%;
            max-width:1000px;

            background:white;

            border-radius:20px;

            padding:30px;

            text-align:center;

            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }

        h1{

            margin-bottom:25px;

            color:#222;

            font-size:2.2rem;
        }

        .video-box{

            width:100%;

            display:flex;

            justify-content:center;

            align-items:center;
        }

        img{

            width:100%;

            max-width:900px;

            border-radius:15px;

            border:4px solid #007bff;

            box-shadow:0 5px 25px rgba(0,0,0,0.3);
        }

        .btn{

            display:inline-block;

            margin-top:25px;

            padding:14px 28px;

            background:#007bff;

            color:white;

            text-decoration:none;

            border-radius:10px;

            font-size:18px;

            transition:0.3s;
        }

        .btn:hover{
            background:#0056b3;
            transform:scale(1.03);
        }

        @media(max-width:768px){

            .container{
                padding:20px;
            }

            h1{
                font-size:1.7rem;
            }

            img{
                border-width:2px;
            }

            .btn{
                width:100%;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Live Floating Waste Detection</h1>

        <div class="video-box">

            <img src="{{ url_for('video_feed') }}">

        </div>

        <a href="/" class="btn">
            ⬅ Back to Upload
        </a>

    </div>

</body>

</html>
