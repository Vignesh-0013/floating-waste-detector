<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Floating Waste Detection</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{

            width:100%;
            max-width:800px;

            background:white;

            border-radius:20px;

            padding:40px 30px;

            box-shadow:0 10px 30px rgba(0,0,0,0.3);

            text-align:center;
        }

        h1{
            color:#222;
            margin-bottom:30px;
            font-size:2.2rem;
        }

        .upload-box{

            border:2px dashed #999;
            border-radius:15px;

            padding:30px;

            margin-bottom:25px;

            background:#fafafa;
        }

        input[type="file"]{
            margin-top:10px;
            font-size:16px;
        }

        button{

            padding:14px 28px;

            border:none;

            border-radius:10px;

            background:#007bff;

            color:white;

            font-size:17px;

            cursor:pointer;

            transition:0.3s;

            margin:10px;
        }

        button:hover{
            background:#0056b3;
            transform:scale(1.03);
        }

        .live-btn{
            background:#28a745;
        }

        .live-btn:hover{
            background:#1e7e34;
        }

        img{

            width:100%;

            max-width:700px;

            margin-top:25px;

            border-radius:15px;

            box-shadow:0 5px 20px rgba(0,0,0,0.2);
        }

        h2{
            margin-top:25px;
            color:#333;
        }

        @media(max-width:768px){

            .container{
                padding:25px 20px;
            }

            h1{
                font-size:1.8rem;
            }

            button{
                width:100%;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Floating Waste Detection</h1>

        <div class="upload-box">

            <form action="/predict" method="POST" enctype="multipart/form-data">

                <input type="file" name="file" required>

                <br><br>

                <button type="submit">
                    Detect Waste
                </button>

            </form>

        </div>

        <a href="/live">
            <button class="live-btn">
                Open Live Detection
            </button>
        </a>

        {% if output_image %}

            <h2>Detection Result</h2>

            <img src="{{ output_image }}">

        {% endif %}

    </div>

</body>
</html>
